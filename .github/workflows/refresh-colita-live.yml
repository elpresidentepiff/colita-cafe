name: Refresh Colita live site

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-colita-live.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh site
        run: python tools/refresh_site.py

      - name: Commit refreshed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html robots.txt
          if git diff --cached --quiet; then
            echo "No site changes required"
            exit 0
          fi
          git commit -m "Elevate coffee chemistry and research education"
          git push

