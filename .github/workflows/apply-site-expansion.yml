name: Apply Colita site expansion

on:
  push:
    branches:
      - site-expansion-2026
    paths:
      - 'scripts/patch_site_2026.py'
      - '.github/workflows/apply-site-expansion.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[site-expansion-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-expansion-2026
      - name: Apply site patch
        run: python3 scripts/patch_site_2026.py
      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html SITE_EXPANSION_REPORT.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Expand Colita site research, revenue and track record [site-expansion-applied]"
            git push origin HEAD:site-expansion-2026
          fi
